<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oyna.myracland</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Temel stil */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background: linear-gradient(120deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        h1 {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 30px #00ffcc;
        }

        .ip-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px #00ffcc;
            margin-bottom: 30px;
            text-align: center;
            transition: transform 0.3s;
        }

        .ip-box:hover {
            transform: scale(1.05);
        }

        .ip-box p {
            font-size: 1.5rem;
            margin-bottom: 0;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 10px #00ffcc;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #00ffcc;
        }

        .rules {
            max-width: 600px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px #0077ff;
            margin-top: 20px;
        }

        .rules h2 {
            color: #ffcc00;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #ffcc00;
        }

        .rules ul {
            list-style: none;
            font-size: 1.1rem;
        }

        .rules li {
            margin-bottom: 10px;
            padding-left: 15px;
            position: relative;
        }

        .rules li::before {
            content: '✔';
            position: absolute;
            left: 0;
            color: #00ffcc;
        }

        /* Arka plan animasyonu */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <h1>🌌 MyRacLand 🌌</h1>

    <div class="ip-box">
        <p>Sunucu IP: <strong>66.249.72.238:25565</strong></p>
        <button onclick="copyIP()">IP'yi Kopyala</button>
    </div>

    <div class="rules">
        <h2>Kurallar</h2>
        <ul>
            <li>Küfür yok.</li>
            <li>Çalmaya çalışmak yok.</li>
            <li>Hile yasak.</li>
            <li>Arkadaşça oyna 😎</li>
        </ul>
    </div>

    <canvas class="stars"></canvas>

    <script>
        // IP kopyalama
        function copyIP() {
            navigator.clipboard.writeText("66.249.72.238:25565");
            alert("IP kopyalandı!");
        }

        // Arka plan yıldız animasyonu
        const canvas = document.querySelector('.stars');
        const ctx = canvas.getContext('2d');
        let w, h, starsArray;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            starsArray = [];
            for (let i = 0; i < 200; i++) {
                starsArray.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.5,
                    dx: (Math.random() - 0.5) * 0.5,
                    dy: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            starsArray.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = "#fff";
                ctx.fill();
                s.x += s.dx;
                s.y += s.dy;
                if (s.x < 0) s.x = w;
                if (s.x > w) s.x = 0;
                if (s.y < 0) s.y = h;
                if (s.y > h) s.y = 0;
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>

</html>
